id: dicomqc_02_findings
parent_id: dicomqc
parent_name: dicomqc
parent_description: DICOM metadata quality-control summaries generated by dicomqc.
section_name: dicomqc findings and recommended actions
description: Metadata findings and next steps. Raw tag values are omitted. dicomqc
  never modifies files.
plot_type: table
data:
  finding_001:
    file: dicom/raw_phi.dcm
    severity: error
    rule_id: research-release-v0.1.direct_phi.PatientBirthDate
    tag: (0010,0030)
    keyword: PatientBirthDate
    value_state: present
    message: PatientBirthDate is populated and may contain direct PHI.
    recommendation: Remove this value or verify that the upstream anonymizer removes
      it for research release.
  finding_002:
    file: dicom/private_tags.dcm
    severity: warning
    rule_id: research-release-v0.1.private_tags.present
    tag: ''
    keyword: PrivateTags
    value_state: present
    message: 1 private DICOM tag(s) are present.
    recommendation: Review vendor-specific private tags before release; private tags
      can contain site, protocol, or operator identifiers.
  finding_003:
    file: dicom/raw_phi.dcm
    severity: warning
    rule_id: research-release-v0.1.pseudonym_format.PatientID
    tag: (0010,0020)
    keyword: PatientID
    value_state: present
    message: PatientID is populated but does not match the built-in research pseudonym
      pattern.
    recommendation: Use a non-identifying research identifier such as sub-001, SUBJ001,
      participant-123, or anon-001.
  finding_004:
    file: dicom/raw_phi.dcm
    severity: warning
    rule_id: research-release-v0.1.pseudonym_format.PatientName
    tag: (0010,0010)
    keyword: PatientName
    value_state: present
    message: PatientName is populated but does not match the built-in research pseudonym
      pattern.
    recommendation: Use a non-identifying research identifier such as sub-001, SUBJ001,
      participant-123, or anon-001.
  finding_005:
    file: dicom/raw_phi.dcm
    severity: warning
    rule_id: research-release-v0.1.private_tags.present
    tag: ''
    keyword: PrivateTags
    value_state: present
    message: 1 private DICOM tag(s) are present.
    recommendation: Review vendor-specific private tags before release; private tags
      can contain site, protocol, or operator identifiers.
pconfig:
  id: dicomqc_findings_table
  title: dicomqc findings and recommended actions
  col1_header: Finding ID
headers:
  severity:
    title: Severity
    description: dicomqc finding severity
    bgcols:
      error: '#fce8e4'
      warning: '#fff2cf'
      info: '#dff1f2'
  file:
    title: File
    description: Relative DICOM file path
    scale: false
  keyword:
    title: Keyword
    description: DICOM keyword or finding group
    hidden: true
    scale: false
  tag:
    title: Tag
    description: DICOM tag when applicable
    hidden: true
    scale: false
  value_state:
    title: Value state
    hidden: true
    description: Redaction-safe value state
    bgcols:
      present: '#f97316'
      empty: '#94a3b8'
      absent: '#22c55e'
  rule_id:
    title: Rule
    description: Stable dicomqc rule identifier
    scale: false
    hidden: true
  message:
    title: Finding
    description: Finding summary
    scale: false
  recommendation:
    title: Next step
    description: Recommended action using external tools
    scale: false
