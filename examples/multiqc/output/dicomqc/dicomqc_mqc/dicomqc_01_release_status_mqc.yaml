pconfig:
  id: dicomqc_release_status_table
  title: dicomqc audit status
  col1_header: Audit
headers:
  Status:
    title: Status
    description: Metadata audit outcome; not approval to share data
    bgcols:
      Checks passed: '#e2f2eb'
      Warnings require review: '#fff2cf'
      Errors require attention: '#fce8e4'
      No readable files: '#fff2cf'
  Profile:
    title: Profile
    description: dicomqc profile used for the audit
    scale: false
    hidden: true
  Files scanned:
    title: Files read
    description: DICOM files successfully scanned
    scale: Blues
  Files passed:
    title: Without errors
    description: Scanned files without error findings; warnings may remain
    scale: Greens
    hidden: true
  Files failed:
    title: With errors
    description: Scanned files with error findings
    scale: Reds
    hidden: true
  Errors:
    title: Errors
    description: Findings requiring attention
    scale: Reds
  Warnings:
    title: Warnings
    description: Findings requiring review
    scale: YlOrBr
  Skipped files:
    title: Unreadable files
    description: Files that could not be read as DICOM
    scale: Purples
