name: Build desktop installers

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing annotated release tag to build (for example v0.2.0)"
        required: true
        type: string
      platform:
        description: Platform to build and inspect
        type: choice
        default: all
        options:
          - all
          - macos-x64
          - macos-arm64
          - windows-x64
          - linux-x64
          - linux-arm64

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag }}

concurrency:
  group: desktop-${{ inputs.tag }}-${{ inputs.platform }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      version: ${{ steps.version.outputs.version }}
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Validate release tag input
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Enter an existing annotated stable tag, such as v0.2.0.'
            exit 1
          fi
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install release metadata parser
        run: python -m pip install 'PyYAML>=6'
      - name: Restore annotated tag object
        run: git fetch --force --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
      - name: Record source revision
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Select platforms
        id: matrix
        env:
          PLATFORM: ${{ inputs.platform || 'all' }}
        run: python scripts/desktop_release.py matrix
      - name: Verify annotated stable tag and release version
        id: version
        run: env GITHUB_REF_TYPE=tag GITHUB_REF_NAME="$RELEASE_TAG" python scripts/desktop_release.py version

  desktop:
    needs: prepare
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@1.86.0

      - name: Install Python engine and build dependencies
        run: python -m pip install ".[api,desktop-build,test,api-test]"

      - name: Verify package, app and Tauri versions
        run: python scripts/build_desktop_engine.py --check-versions

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 xvfb xauth

      - name: Test Python engine and packaging
        run: python -m pytest --maxfail=0 --junitxml=build/python-tests.xml

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Test frontend
        working-directory: app
        run: npm test

      - name: Build native Python engine
        run: python scripts/build_desktop_engine.py

      - name: Smoke test relocated frozen engine and worker processes
        env:
          DICOMQC_DESKTOP_ENGINE: app/src-tauri/engine
        run: python -m pytest tests/test_desktop_build.py -k frozen --no-cov --junitxml=build/frozen-tests.xml

      - name: Build frontend
        working-directory: app
        run: npm run build

      - name: Test Rust launcher
        run: cargo test --manifest-path app/src-tauri/Cargo.toml --locked

      - name: Test native bridge with frozen engine
        env:
          DICOMQC_TEST_ENGINE: ${{ github.workspace }}/app/src-tauri/engine/dicomqc-api${{ runner.os == 'Windows' && '.exe' || '' }}
        run: cargo test --manifest-path app/src-tauri/Cargo.toml --locked -- --ignored

      - name: Smoke test Linux native GUI
        if: runner.os == 'Linux'
        env:
          DICOMQC_SMOKE_DIR: ${{ github.workspace }}/build/native-verification
          DICOMQC_DESKTOP_ENGINE: ${{ github.workspace }}/app/src-tauri/engine/dicomqc-api
          GDK_BACKEND: x11
          WEBKIT_DISABLE_COMPOSITING_MODE: '1'
        run: xvfb-run -a timeout 120s cargo run --manifest-path app/src-tauri/Cargo.toml --features native-smoke --locked

      - name: Build native installer
        working-directory: app
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: ${{ runner.os == 'Windows' && '-C target-feature=+crt-static' || '' }}
        run: npm run tauri -- build --bundles ${{ matrix.bundle }}

      - name: Inspect Linux installer
        if: runner.os == 'Linux'
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          images=(app/src-tauri/target/release/bundle/appimage/*.AppImage)
          test "${#images[@]}" -eq 1
          image="$(realpath "${images[0]}")"
          unpacked="$(mktemp -d)"
          (cd "$unpacked" && "$image" --appimage-extract >/dev/null)
          binary="$unpacked/squashfs-root/usr/bin/dicomqc-desktop"
          test -x "$binary"
          python scripts/desktop_release.py architecture "$binary"
          python scripts/desktop_release.py inspect "$unpacked/squashfs-root"
          smoke_output="$(DICOMQC_DESKTOP_SMOKE_TEST=1 xvfb-run -a timeout 90s "$image" 2>&1)"
          printf '%s\n' "$smoke_output"
          grep -Fq 'Desktop startup smoke test passed' <<<"$smoke_output"

      - name: Inspect macOS installer
        if: runner.os == 'macOS'
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          images=(app/src-tauri/target/release/bundle/dmg/*.dmg)
          test "${#images[@]}" -eq 1
          hdiutil verify "${images[0]}"
          mount_dir="$(mktemp -d)"
          hdiutil attach "${images[0]}" -readonly -nobrowse -mountpoint "$mount_dir"
          trap 'hdiutil detach "$mount_dir"' EXIT
          apps=("$mount_dir"/*.app)
          test "${#apps[@]}" -eq 1
          plutil -lint "${apps[0]}/Contents/Info.plist"
          codesign --verify --deep --strict --verbose=2 "${apps[0]}"
          binary="$(python3 -c 'from pathlib import Path; import sys; print(Path(sys.argv[1]).resolve(strict=True))' "${apps[0]}/Contents/MacOS/dicomqc-desktop")"
          test -x "$binary"
          python scripts/desktop_release.py architecture "$binary"
          python scripts/desktop_release.py inspect "${apps[0]}/Contents/Resources"
          smoke_output="$(DICOMQC_DESKTOP_SMOKE_TEST=1 "$binary" 2>&1)"
          printf '%s\n' "$smoke_output"
          grep -Fq 'Desktop startup smoke test passed' <<<"$smoke_output"

      - name: Install and inspect Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          $installers = @(Get-ChildItem app/src-tauri/target/release/bundle/nsis/*-setup.exe)
          if ($installers.Count -ne 1) { throw 'Expected one Windows installer' }
          $destination = Join-Path $env:LOCALAPPDATA "dicomqc-install-test-$env:GITHUB_RUN_ID"
          $setup = Start-Process -FilePath $installers[0].FullName -ArgumentList @('/S', "/D=$destination") -PassThru
          if (-not $setup.WaitForExit(180000)) { $setup.Kill(); throw 'Installer timed out' }
          if ($setup.ExitCode -ne 0) { throw "Installer failed: $($setup.ExitCode)" }
          python scripts/desktop_release.py inspect "$destination"
          if ($LASTEXITCODE -ne 0) { throw 'Installed engine verification failed' }
          $binary = Get-ChildItem $destination -Filter dicomqc-desktop.exe -Recurse | Select-Object -First 1
          if (-not $binary) { throw 'Installed application is missing' }
          python scripts/desktop_release.py architecture $binary.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Installed application architecture is incorrect' }
          $application = Start-Process -FilePath $binary.FullName -PassThru
          try {
            $windowFound = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              Start-Sleep -Seconds 1
              $application.Refresh()
              if ($application.HasExited) { throw "Installed application exited: $($application.ExitCode)" }
              if ($application.MainWindowHandle -ne 0) { $windowFound = $true; break }
            }
            if (-not $windowFound) { throw 'Installed application did not create a window' }
          } finally {
            if (-not $application.HasExited) { Stop-Process -Id $application.Id }
          }
          Get-AuthenticodeSignature $installers[0].FullName | Format-List Status, StatusMessage

      - name: Collect installer and checksum
        env:
          PLATFORM: ${{ matrix.platform }}
        run: python scripts/desktop_release.py collect

      - name: Upload inspected installer
        uses: actions/upload-artifact@v4
        with:
          name: dicomqc-${{ needs.prepare.outputs.version }}-${{ matrix.platform }}
          path: build/installers/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dicomqc-desktop-${{ matrix.platform }}-tests
          path: build/*-tests.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Linux native GUI evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: dicomqc-desktop-${{ matrix.platform }}-native-gui
          path: |
            build/native-verification/*.png
            build/native-verification/*.json
            !build/native-verification/app-data/**
          if-no-files-found: warn
          retention-days: 7

  release:
    name: Prepare draft desktop release
    if: inputs.platform == 'all'
    needs: [prepare, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dicomqc-${{ needs.prepare.outputs.version }}-*
          path: release-assets
          merge-multiple: true
      - name: Verify and attach installers to draft
        working-directory: release-assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(*)
          checksums=(*.sha256)
          test "${#assets[@]}" -eq 10
          test "${#checksums[@]}" -eq 5
          sha256sum --check "${checksums[@]}"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true || {
              echo 'Refusing to replace assets on a published release' >&2
              exit 1
            }
            gh release upload "$RELEASE_TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
              --title "dicomqc $VERSION" \
              --notes "Desktop installers and SHA-256 checksums for dicomqc $VERSION. Review all platform checks and complete the release notes before publishing. macOS builds are not Apple-notarized; Windows installers are unsigned. Python is bundled. CLI publication to PyPI runs separately from the same tag."
          fi
