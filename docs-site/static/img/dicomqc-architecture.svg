<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 208" role="img" aria-labelledby="title desc">
  <title id="title">dicomqc architecture</title>
  <desc id="desc">DICOM files pass through the pydicom metadata reader and audit rules to HTML, MultiQC, JSON and CSV reports. Scan checks one dataset; compare checks paired source and candidate datasets. Inputs are read-only and pixels are not inspected.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="m0 0 8 4-8 4" fill="none" stroke="#81918f" stroke-width="1.4"/></marker>
    <style>
      text { font-family: Inter, Arial, sans-serif; }
      .title { fill: #243f3c; font-size: 17px; font-weight: 600; }
      .detail { fill: #586b68; font-size: 14px; }
      .node { fill: #fff; stroke: #d4dfdc; }
      .core { fill: #f0f7f5; stroke: #96bfb3; }
      .flow { fill: none; stroke: #81918f; stroke-width: 1.4; marker-end: url(#arrow); }
      .note { fill: #586b68; font-size: 14px; }
      @media (prefers-color-scheme: dark) {
        .title { fill: #e5efec; } .detail, .note { fill: #b5c6c1; }
        .node { fill: #202c29; stroke: #52615b; }
        .core { fill: #243b33; stroke: #6b9988; }
      }
    </style>
  </defs>
  <text x="16" y="29" class="note">scan: one dataset · compare: source + candidate + manifest</text>
  <rect x="16" y="54" width="145" height="88" rx="6" class="node"/>
  <text x="32" y="86" class="title">DICOM files</text>
  <text x="32" y="113" class="detail">Files or folders</text>
  <path d="M162 98H198" class="flow"/>
  <rect x="202" y="54" width="160" height="88" rx="6" class="core"/>
  <text x="218" y="86" class="title">Metadata reader</text>
  <text x="218" y="113" class="detail">pydicom → records</text>
  <path d="M363 98H399" class="flow"/>
  <rect x="403" y="54" width="145" height="88" rx="6" class="core"/>
  <text x="419" y="86" class="title">Audit rules</text>
  <text x="419" y="113" class="detail">Checks → findings</text>
  <path d="M549 98H585" class="flow"/>
  <rect x="589" y="54" width="155" height="88" rx="6" class="node"/>
  <text x="605" y="81" class="title">Reports</text>
  <text x="605" y="105" class="detail">HTML · MultiQC</text>
  <text x="605" y="126" class="detail">JSON · CSV</text>
  <text x="16" y="180" class="note">Read-only inputs. Metadata checks only; pixels are not inspected.</text>
</svg>
