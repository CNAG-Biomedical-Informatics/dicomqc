<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 410" role="img" aria-labelledby="title desc">
  <title id="title">dicomqc architecture</title>
  <desc id="desc">Scan a dataset or compare source and candidate datasets with a manifest. DICOM files pass through the metadata reader, audit rules and report writers. Inputs are read-only and pixels are not inspected.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="m0 0 8 4-8 4" fill="none" stroke="#81918f" stroke-width="1.4"/></marker>
    <style>
      text { font-family: Inter, Arial, sans-serif; }
      .title { fill: #243f3c; font-size: 17px; font-weight: 600; }
      .detail { fill: #586b68; font-size: 14px; }
      .node { fill: #fff; stroke: #d4dfdc; }
      .core { fill: #f0f7f5; stroke: #96bfb3; }
      .flow { fill: none; stroke: #81918f; stroke-width: 1.4; marker-end: url(#arrow); }
      .note { fill: #586b68; font-size: 14px; }
      @media (prefers-color-scheme: dark) {
        .title { fill: #e5efec; } .detail, .note { fill: #b5c6c1; }
        .node { fill: #202c29; stroke: #52615b; }
        .core { fill: #243b33; stroke: #6b9988; }
      }
    </style>
  </defs>
  <text x="16" y="25" class="note">scan: one dataset</text>
  <text x="16" y="47" class="note">compare: source + candidate + manifest</text>
  <rect x="16" y="65" width="328" height="54" rx="6" class="node"/>
  <text x="32" y="98" class="title">DICOM files</text>
  <text x="175" y="98" class="detail">Files or folders</text>
  <path d="M180 120V137" class="flow"/>
  <rect x="16" y="142" width="328" height="54" rx="6" class="core"/>
  <text x="32" y="175" class="title">Metadata reader</text>
  <text x="175" y="175" class="detail">pydicom → records</text>
  <path d="M180 197V214" class="flow"/>
  <rect x="16" y="219" width="328" height="54" rx="6" class="core"/>
  <text x="32" y="252" class="title">Audit rules</text>
  <text x="175" y="252" class="detail">Checks → findings</text>
  <path d="M180 274V291" class="flow"/>
  <rect x="16" y="296" width="328" height="54" rx="6" class="node"/>
  <text x="32" y="329" class="title">Reports</text>
  <text x="175" y="319" class="detail">HTML · MultiQC</text>
  <text x="175" y="340" class="detail">JSON · CSV</text>
  <text x="16" y="380" class="note">Read-only inputs. Metadata checks only.</text>
  <text x="16" y="401" class="note">Pixels are not inspected.</text>
</svg>
