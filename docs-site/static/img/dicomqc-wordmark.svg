<svg xmlns="http://www.w3.org/2000/svg" width="240" height="64" viewBox="0 0 240 64" role="img" aria-labelledby="title desc">
  <title id="title">dicomqc</title>
  <desc id="desc">dicom in black and qc in muted green, adapted for dark backgrounds.</desc>
  <style>
    .dicom { fill: #000000; }
    .qc { fill: #35745a; }
    @media (prefers-color-scheme: dark) {
      .dicom { fill: #f2f2f2; }
      .qc { fill: #8fc4a8; }
    }
  </style>
  <text x="120" y="46" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" letter-spacing="0"><tspan class="dicom">dicom</tspan><tspan class="qc">qc</tspan></text>
</svg>
