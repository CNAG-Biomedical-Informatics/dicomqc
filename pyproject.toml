[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dicomqc"
version = "0.2.0"
description = "Audit de-identified DICOM metadata for privacy risks and dataset consistency."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  {name = "Manuel Rueda, CNAG"}
]
keywords = ["dicom", "quality-control", "de-identification", "pseudonymization", "research"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "pydicom>=3.0",
  "PyYAML>=6",
]

[project.urls]
Homepage = "https://github.com/CNAG-Biomedical-Informatics/dicomqc"
Documentation = "https://cnag-biomedical-informatics.github.io/dicomqc/"
Repository = "https://github.com/CNAG-Biomedical-Informatics/dicomqc"
Issues = "https://github.com/CNAG-Biomedical-Informatics/dicomqc/issues"
Changelog = "https://github.com/CNAG-Biomedical-Informatics/dicomqc/blob/main/CHANGELOG.md"

[project.optional-dependencies]
api = ["fastapi>=0.115,<0.143", "uvicorn>=0.30,<0.55"]
desktop-build = ["pyinstaller>=6.11,<7"]
api-test = ["httpx>=0.28,<0.29"]
test = [
  "pytest>=8",
  "pytest-cov>=5",
]
release = [
  "build>=1.2",
  "twine>=5",
]

[project.scripts]
dicomqc = "dicomqc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
